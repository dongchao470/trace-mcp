name: Trace iOS 16 critical network fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/trace-ios16.yml
      - ci/**
      - Trace*/**
      - Package.swift
      - Package.resolved
      - Tools/QUIC/**
      - .gitmodules

permissions:
  contents: read

concurrency:
  group: trace-ios16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device-baseline:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      QUICHE_DEPLOYMENT_TARGET: '16.0'
    steps:
      - name: Checkout complete upstream source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Rust toolchain for full QUIC support
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          components: llvm-tools

      - name: Record toolchain and dependency versions
        id: versions
        shell: bash
        run: |
          mkdir -p ci-logs
          xcodebuild -version | tee ci-logs/toolchain.log
          xcodebuild -showsdks | tee -a ci-logs/toolchain.log
          rustc -Vv | tee -a ci-logs/toolchain.log
          git rev-parse HEAD | tee ci-logs/revision.log
          git submodule status --recursive | tee ci-logs/submodules.log
          key=$(cat ci-logs/toolchain.log ci-logs/submodules.log | shasum -a 256 | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore complete QUIC XCFramework
        id: quic-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/quiche/include
            build/quiche/lib
            build/quiche/quiche.xcframework
          key: trace-quiche-ios16-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.key }}-${{ hashFiles('Tools/QUIC/build_quiche_apple.sh') }}

      - name: Cache Rust compilation
        if: steps.quic-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ThirdParty/quiche -> build/quiche/cargo-target

      - name: Build QUIC without removing any protocol support
        if: steps.quic-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          ./Tools/QUIC/build_quiche_apple.sh 2>&1 | tee ci-logs/quiche.log

      - name: Verify QUIC exports in each architecture
        shell: bash
        run: |
          python3 -u ci/verify_quiche_symbols.py 2>&1 | tee ci-logs/quiche-symbols.log

      - name: Save verified QUIC XCFramework
        if: steps.quic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/quiche/include
            build/quiche/lib
            build/quiche/quiche.xcframework
          key: ${{ steps.quic-cache.outputs.cache-primary-key }}

      - name: Resolve pinned Swift packages
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project Trace.xcodeproj -scheme Trace \
            -clonedSourcePackagesDirPath SourcePackages 2>&1 | tee ci-logs/resolve.log

      - name: Apply reviewed CFError ownership fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ci/ios16-certificate-error-ownership.patch
          git apply ci/ios16-certificate-error-ownership.patch
          git diff --check
          git diff -- TraceSecurity/Certificate/CertificateManager.swift | tee ci-logs/certificate-error-ownership.patch

      - name: Apply reviewed SSE and replay compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          for patch in ci/ios16-stream-replay-1.patch ci/ios16-stream-replay-2.patch ci/ios16-stream-replay-3.patch ci/ios16-stream-replay-tests.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          git diff --stat | tee ci-logs/critical-network-fixes.log

      - name: Apply reviewed large-body and SSE status fixes
        shell: bash
        run: |
          set -euo pipefail
          for patch in ci/ios16-large-body-*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          git diff --stat | tee ci-logs/large-body-fixes.log

      - name: Apply reviewed MCP hooks
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ci/ios16-mcp-hooks.patch
          git apply ci/ios16-mcp-hooks.patch
          git diff --check
          git diff --stat | tee ci-logs/mcp-hooks.log

      - name: Apply post-MCP patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for patch in ci/ios16-post-*.patch; do
            echo "applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          git diff --stat | tee ci-logs/post-patches.log

      - name: Assemble MCP server sources
        shell: bash
        run: |
          set -euo pipefail
          sh ci/assemble_mcp_sources.sh | tee ci-logs/mcp-sources.log

      - name: Assemble Simplified Chinese localization
        shell: bash
        run: |
          set -euo pipefail
          cat ci/l10n-zh-hans-*.strings > ci-logs/zh-Hans.strings
          wc -c ci-logs/zh-Hans.strings

      - name: Run exact-source critical network regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/run-critical-network-regressions.py 2>&1 | tee ci-logs/critical-network-regressions.log

      - name: Run exact-source service and recording regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/run-service-regressions.py 2>&1 | tee ci-logs/service-regressions.log

      - name: Build full device app for iOS 16
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Trace.xcodeproj -scheme Trace -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CURRENT_PROJECT_VERSION=17 \
            build 2>&1 | tee ci-logs/build.log

      - name: Verify iOS deployment targets and package an ad-hoc IPA
        shell: bash
        run: |
          mkdir -p DerivedData/Build/Products/Release-iphoneos/Trace.app/zh-Hans.lproj
          cp ci-logs/zh-Hans.strings DerivedData/Build/Products/Release-iphoneos/Trace.app/zh-Hans.lproj/Localizable.strings
          python3 ci/package_ios16_ipa.py
          mkdir -p Package/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/Trace.app Package/Payload/Trace.app
          (cd Package && zip -qr ../Trace-build17-iOS16.ipa Payload)
          shasum -a 256 Trace-build17-iOS16.ipa | tee ci-logs/ipa.sha256

      - name: Upload baseline IPA
        uses: actions/upload-artifact@v4
        with:
          name: Trace-build17-iOS16
          path: Trace-build17-iOS16.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ios16-diagnostics
          path: ci-logs
          retention-days: 7
