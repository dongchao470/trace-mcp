name: Trace iOS 16 baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/trace-ios16.yml
      - ci/**
      - Trace*/**
      - Package.swift
      - Package.resolved
      - Tools/QUIC/**
      - .gitmodules

permissions:
  contents: read

concurrency:
  group: trace-ios16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device-baseline:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      QUICHE_DEPLOYMENT_TARGET: '16.0'
    steps:
      - name: Checkout complete upstream source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Rust toolchain for full QUIC support
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          components: llvm-tools

      - name: Record toolchain and dependency versions
        id: versions
        shell: bash
        run: |
          mkdir -p ci-logs
          xcodebuild -version | tee ci-logs/toolchain.log
          xcodebuild -showsdks | tee -a ci-logs/toolchain.log
          rustc -Vv | tee -a ci-logs/toolchain.log
          git rev-parse HEAD | tee ci-logs/revision.log
          git submodule status --recursive | tee ci-logs/submodules.log
          key=$(cat ci-logs/toolchain.log ci-logs/submodules.log | shasum -a 256 | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore complete QUIC XCFramework
        id: quic-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/quiche/include
            build/quiche/lib
            build/quiche/quiche.xcframework
          key: trace-quiche-ios16-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.key }}-${{ hashFiles('Tools/QUIC/build_quiche_apple.sh') }}

      - name: Cache Rust compilation
        if: steps.quic-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ThirdParty/quiche -> build/quiche/cargo-target

      - name: Build QUIC without removing any protocol support
        if: steps.quic-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          ./Tools/QUIC/build_quiche_apple.sh 2>&1 | tee ci-logs/quiche.log

      - name: Verify QUIC exports in each architecture
        shell: bash
        run: |
          python3 -u - <<'PY' 2>&1 | tee ci-logs/quiche-symbols.log
          import pathlib, re, subprocess

          xcframework = pathlib.Path('build/quiche/quiche.xcframework')
          rust_lib = pathlib.Path(subprocess.check_output(['rustc', '--print', 'target-libdir'], text=True).strip())
          nm = rust_lib.parent / 'bin' / 'llvm-nm'
          subprocess.run([nm, '--version'], check=True)
          verifier = pathlib.Path('Tools/QUIC/verify_quiche_symbols.sh').read_text()
          required = set(re.findall(r'^  "(quiche_[a-z0-9_]+)"$', verifier, re.MULTILINE))
          if not required:
              raise SystemExit('No required QUIC exports found in the upstream verifier')
          slices = [('ios-arm64', 'arm64'), ('ios-arm64_x86_64-simulator', 'arm64'), ('ios-arm64_x86_64-simulator', 'x86_64')]
          for directory, arch in slices:
              archive = xcframework / directory / 'libquiche.a'
              print(f'Checking {archive} ({arch})')
              symbols = subprocess.check_output([nm, f'--arch={arch}', '-gUj', archive], text=True)
              exported = {line.removeprefix('_') for line in symbols.splitlines()}
              missing = required - exported
              if missing:
                  raise SystemExit(f'{arch}: missing QUIC exports: {", ".join(sorted(missing))}')
              print(f'Verified {len(required)} QUIC exports for {directory}/{arch}')
          PY

      - name: Save verified QUIC XCFramework
        if: steps.quic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/quiche/include
            build/quiche/lib
            build/quiche/quiche.xcframework
          key: ${{ steps.quic-cache.outputs.cache-primary-key }}

      - name: Resolve pinned Swift packages
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project Trace.xcodeproj -scheme Trace \
            -clonedSourcePackagesDirPath SourcePackages 2>&1 | tee ci-logs/resolve.log

      - name: Apply reviewed CFError ownership fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ci/ios16-certificate-error-ownership.patch
          git apply ci/ios16-certificate-error-ownership.patch
          git diff --check
          git diff -- TraceSecurity/Certificate/CertificateManager.swift | tee ci-logs/certificate-error-ownership.patch

      - name: Build full device app for iOS 16
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Trace.xcodeproj -scheme Trace -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CURRENT_PROJECT_VERSION=13 \
            build 2>&1 | tee ci-logs/build.log

      - name: Verify iOS deployment targets and package an ad-hoc IPA
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, plistlib, re, subprocess

          def version(text):
              return tuple(map(int, (text + '.0.0').split('.')[:3]))

          app = pathlib.Path('DerivedData/Build/Products/Release-iphoneos/Trace.app')
          app_info = plistlib.loads((app / 'Info.plist').read_bytes())
          app_group = app_info.get('AppGroupIdentifier') or 'group.' + app_info['CFBundleIdentifier']
          sources = {'Trace.app': 'Trace/Trace.entitlements', 'TraceVPN.appex': 'TraceVPN/TraceVPN.entitlements', 'TraceWidgetExtension.appex': 'TraceWidget/TraceWidget.entitlements'}
          bundles = sorted(list(app.rglob('*.framework')) + list(app.rglob('*.appex')), key=lambda p: len(p.parts), reverse=True) + [app]
          assert set(sources) <= {p.name for p in bundles}, 'Missing the app, packet tunnel, or widget'
          records = []
          keychain_groups = {}
          for bundle in bundles:
              info = plistlib.loads((bundle / 'Info.plist').read_bytes())
              minimum = info.get('MinimumOSVersion')
              if bundle.name in sources:
                  assert minimum, f'{bundle.name}: missing MinimumOSVersion'
              if minimum:
                  assert version(minimum) <= (16, 0, 0), (str(bundle), minimum)
              executable = bundle / info['CFBundleExecutable']
              result = subprocess.run(['xcrun', 'vtool', '-show-build', str(executable)], capture_output=True, text=True, check=True)
              min_versions = re.findall(r'^\s*minos\s+(\d+(?:\.\d+){0,2})\s*$', result.stdout, re.MULTILINE)
              assert min_versions and all(version(v) <= (16, 0, 0) for v in min_versions), (str(bundle), result.stdout)
              records.append({'bundle': bundle.name, 'id': info.get('CFBundleIdentifier'), 'minimumOS': minimum, 'macho': result.stdout})
              command = ['codesign', '--force', '--sign', '-']
              source = sources.get(bundle.name)
              if source:
                  assert info.get('AppGroupIdentifier', app_group) == app_group, f'{bundle.name}: different application group'
                  assert '$(' not in app_group and app_group.startswith('group.'), app_group
                  text = pathlib.Path(source).read_text().replace('$(APP_GROUP_IDENTIFIER)', app_group).replace('$(AppIdentifierPrefix)', '')
                  groups = plistlib.loads(text.encode()).get('keychain-access-groups', [])
                  if bundle.name in ('Trace.app', 'TraceVPN.appex'):
                      assert len(groups) == 1 and groups[0] == 'com.justin.trace', (bundle.name, groups)
                      # Ad-hoc/TrollStore builds have no Apple Team ID prefix.
                      # Use the exact entitlement instead of inferring "com." as a Team ID.
                      info['TraceKeychainAccessGroup'] = groups[0]
                      (bundle / 'Info.plist').write_bytes(plistlib.dumps(info))
                      keychain_groups[bundle.name] = groups[0]
                      records[-1]['keychainAccessGroup'] = groups[0]
                  assert info['CFBundleVersion'] == '13', (bundle.name, info['CFBundleVersion'])
                  entitlements = pathlib.Path('ci-logs') / (bundle.name + '.entitlements.plist')
                  entitlements.write_text(text)
                  command += ['--entitlements', str(entitlements)]
              subprocess.run(command + [str(bundle)], check=True)
          assert keychain_groups == {'Trace.app': 'com.justin.trace', 'TraceVPN.appex': 'com.justin.trace'}
          pathlib.Path('ci-logs/bundles.json').write_text(json.dumps(records, indent=2))
          print(json.dumps(records, indent=2))
          PY
          mkdir -p Package/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/Trace.app Package/Payload/Trace.app
          (cd Package && zip -qr ../Trace-baseline-iOS16.ipa Payload)
          shasum -a 256 Trace-baseline-iOS16.ipa | tee ci-logs/ipa.sha256

      - name: Upload baseline IPA
        uses: actions/upload-artifact@v4
        with:
          name: Trace-baseline-iOS16
          path: Trace-baseline-iOS16.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ios16-diagnostics
          path: ci-logs
          retention-days: 7
