name: Trace iOS 16 baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/trace-ios16.yml
      - ci/**
      - Trace*/**
      - Package.swift
      - Package.resolved
      - Tools/QUIC/**
      - .gitmodules

permissions:
  contents: write

concurrency:
  group: trace-ios16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device-baseline:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      QUICHE_DEPLOYMENT_TARGET: '16.0'
    steps:
      - name: Checkout complete upstream source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record toolchain and dependency versions
        id: versions
        shell: bash
        run: |
          mkdir -p ci-logs
          xcodebuild -version | tee ci-logs/toolchain.log
          xcodebuild -showsdks | tee -a ci-logs/toolchain.log
          git rev-parse HEAD | tee ci-logs/revision.log
          git submodule status --recursive | tee ci-logs/submodules.log
          key=$(cat ci-logs/toolchain.log ci-logs/submodules.log | shasum -a 256 | cut -d' ' -f1)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain for full QUIC support
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache complete QUIC XCFramework
        id: quic-cache
        uses: actions/cache@v4
        with:
          path: |
            build/quiche/include
            build/quiche/lib
            build/quiche/quiche.xcframework
          key: trace-quiche-ios16-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.key }}-${{ hashFiles('Tools/QUIC/build_quiche_apple.sh') }}

      - name: Cache Rust compilation
        if: steps.quic-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ThirdParty/quiche -> build/quiche/cargo-target

      - name: Build QUIC without removing any protocol support
        if: steps.quic-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          ./Tools/QUIC/build_quiche_apple.sh 2>&1 | tee ci-logs/quiche.log

      - name: Verify QUIC ABI
        shell: bash
        run: |
          set -o pipefail
          ./Tools/QUIC/verify_quiche_symbols.sh build/quiche/quiche.xcframework 2>&1 | tee ci-logs/quiche-symbols.log

      - name: Resolve pinned Swift packages
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project Trace.xcodeproj -scheme Trace \
            -clonedSourcePackagesDirPath SourcePackages 2>&1 | tee ci-logs/resolve.log

      - name: Build full device app for iOS 16
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Trace.xcodeproj -scheme Trace -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee ci-logs/build.log

      - name: Verify bundle deployment targets and package for TrollStore
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, plistlib, subprocess
          app = pathlib.Path('DerivedData/Build/Products/Release-iphoneos/Trace.app')
          bundles = sorted(list(app.rglob('*.framework')) + list(app.rglob('*.appex')), key=lambda p: len(p.parts), reverse=True) + [app]
          records = []
          for bundle in bundles:
              info_path = bundle / 'Info.plist'
              if not info_path.exists():
                  continue
              info = plistlib.loads(info_path.read_bytes())
              minimum = info.get('MinimumOSVersion', '0')
              assert tuple(map(int, minimum.split('.'))) <= (16, 4, 1), (str(bundle), minimum)
              executable = bundle / info.get('CFBundleExecutable', '')
              if executable.is_file():
                  result = subprocess.run(['xcrun', 'vtool', '-show-build', str(executable)], capture_output=True, text=True, check=True)
                  records.append({'bundle': bundle.name, 'id': info.get('CFBundleIdentifier'), 'minimumOS': minimum, 'macho': result.stdout})
              command = ['codesign', '--force', '--sign', '-']
              source = {'Trace.app': 'Trace/Trace.entitlements', 'TraceVPN.appex': 'TraceVPN/TraceVPN.entitlements', 'TraceWidgetExtension.appex': 'TraceWidget/TraceWidget.entitlements'}.get(bundle.name)
              if source:
                  text = pathlib.Path(source).read_text().replace('$(APP_GROUP_IDENTIFIER)', info['AppGroupIdentifier']).replace('$(AppIdentifierPrefix)', '')
                  entitlements = pathlib.Path('ci-logs') / (bundle.name + '.entitlements.plist')
                  entitlements.write_text(text)
                  command += ['--entitlements', str(entitlements)]
              subprocess.run(command + [str(bundle)], check=True)
          assert any(p.name == 'TraceVPN.appex' for p in bundles), 'Missing packet tunnel'
          assert any(p.name == 'TraceWidgetExtension.appex' for p in bundles), 'Missing widget'
          pathlib.Path('ci-logs/bundles.json').write_text(json.dumps(records, indent=2))
          print(json.dumps(records, indent=2))
          PY
          mkdir -p Package/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/Trace.app Package/Payload/Trace.app
          (cd Package && zip -qr ../Trace-baseline-iOS16.ipa Payload)
          shasum -a 256 Trace-baseline-iOS16.ipa | tee ci-logs/ipa.sha256

      - name: Upload baseline IPA
        uses: actions/upload-artifact@v4
        with:
          name: Trace-baseline-iOS16
          path: Trace-baseline-iOS16.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-ios16-diagnostics
          path: ci-logs
          retention-days: 7

      - name: Publish bounded build status on diagnostics branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, urllib.error, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def api(path, method='GET', body=None):
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(base + path, data=data, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and method == 'GET': return None
                  raise
          diagnostic = {'run': os.environ['GITHUB_RUN_ID'], 'sha': os.environ['GITHUB_SHA'], 'status': os.environ['BUILD_STATUS'], 'logs': {}}
          for path in pathlib.Path('ci-logs').glob('*.log'):
              lines = path.read_text(errors='replace').splitlines()
              errors = [line for line in lines if re.search(r'error:|fatal error|FAILED|failed|BUILD SUCCEEDED', line)]
              diagnostic['logs'][path.name] = [line[:600] for line in (errors[-30:] + lines[-10:])[-40:]]
          data = json.dumps(diagnostic, indent=2).encode()
          branch = 'ci-diagnostics'
          if api('/git/ref/heads/' + branch) is None:
              api('/git/refs', 'POST', {'ref': 'refs/heads/' + branch, 'sha': os.environ['GITHUB_SHA']})
          previous = api('/contents/ci-latest.json?ref=' + branch)
          body = {'message': 'Record iOS 16 baseline result [skip ci]', 'branch': branch, 'content': base64.b64encode(data).decode()}
          if previous: body['sha'] = previous['sha']
          result = api('/contents/ci-latest.json', 'PUT', body)
          print(json.dumps({'run': diagnostic['run'], 'status': diagnostic['status'], 'diagnosticsCommit': result['commit']['sha']}))
          PY
